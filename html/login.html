<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Antrian Tiket</title>
  <link rel="stylesheet" href="../css/login.css">
  <script src="../dist/storage.js" defer></script>
  <script src="../dist/types.js" defer></script>
  <script src="../dist/auth.js" defer></script>
  <script src="../dist/login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <h1>Masuk ke Antrian Tiket</h1>
    <p class="intro">Semua pengguna wajib masuk untuk mengakses antrian, layar, dan panel petugas.</p>
    <form id="form-login" novalidate>
      <label for="login-username">
        Username
        <input id="login-username" type="text" autocomplete="username" required>
      </label>
      <label for="login-password">
        Password
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert"></p>
      <button id="btn-login" type="submit">Masuk</button>
    </form>
    <p class="note">Gunakan akun uji dari <a href="https://dummyjson.com/users" target="_blank" rel="noopener">dummyjson.com/users</a> (contoh: emilys / emilyspass).</p>
  </main>
</body>
</html>
